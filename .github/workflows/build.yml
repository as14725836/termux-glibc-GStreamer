name: termux glibc GStreamer Decoders (aarch64 + armv7l, Dev + libvpx + aom AV1 + de265 HEVC + DTLS)

on:
  workflow_dispatch:
    schedule:
      - cron: '0 7 * * *'
  pull_request:

permissions:
  contents: write
  packages: write

env:
  LAST_COMMIT_FILE: last_gst_commit.txt
  INSTALL_ROOT: /data/data/com.termux/files/usr/glibc

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: 检出 workflow 仓库
        uses: actions/checkout@v4

      - name: 修复依赖
        run: |
          sudo apt clean
          sudo apt autoclean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt update
          sudo rm /var/lib/apt/lists/lock 2>/dev/null || true
          sudo rm /var/cache/apt/archives/lock 2>/dev/null || true

      - name: 安装基础依赖和交叉编译工具
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-pip git pkg-config nasm cmake \
            libglib2.0-dev libdrm-dev libgl1-mesa-dev libglx-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            liborc-0.4-dev libxv-dev libx11-dev libasound2-dev libpulse-dev patchelf \
            libtheora-dev libx264-dev libx265-dev libvpx-dev libde265-dev libssl-dev autoconf automake libtool \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf binutils-arm-linux-gnueabihf

      - name: 升级 Meson 和 Ninja
        run: |
          pip install --upgrade pip
          pip install --upgrade meson ninja

      - name: 克隆 GStreamer 开发版本
        run: |
          git clone --depth=1 https://gitlab.freedesktop.org/gstreamer/gstreamer.git

      - name: 获取开发版本信息
        id: get_dev_info
        run: |
          cd gstreamer
          LATEST_COMMIT=$(git rev-parse HEAD)
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          AUTHOR=$(git log -1 --pretty=format:'%an')
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          COMMIT_DATE=$(git log -1 --pretty=format:'%cd' --date=short)
          VERSION=$(sed -n '2p' "meson.build" | grep -oP "version\\s*:\\s*'\\K[^']+" || echo "dev")
          echo "LATEST_COMMIT=$LATEST_COMMIT" >> $GITHUB_ENV
          echo "COMMIT_SHORT=$COMMIT_SHORT" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "AUTHOR=$AUTHOR" >> $GITHUB_ENV
          echo "BUILD_DATE=$DATE" >> $GITHUB_ENV
          echo "COMMIT_DATE=$COMMIT_DATE" >> $GITHUB_ENV

      - name: 获取上次构建提交
        id: get_last_commit
        run: |
          FILE=${{ env.LAST_COMMIT_FILE }}
          if [ -f "$FILE" ]; then
            LAST_COMMIT=$(cat "$FILE")
          else
            LAST_COMMIT="none"
          fi
          echo "LAST_COMMIT=$LAST_COMMIT" >> $GITHUB_ENV

      - name: 判断是否需要构建
        id: check_build
        run: |
          if [ "$LATEST_COMMIT" = "$LAST_COMMIT" ]; then
            echo "skip_build=true" >> $GITHUB_OUTPUT
            echo "🟡 提交未更新，跳过构建。"
          else
            echo "skip_build=false" >> $GITHUB_OUTPUT
            echo "✅ 发现新提交: $LATEST_COMMIT"
          fi

      - name: 跳过无更新构建
        if: steps.check_build.outputs.skip_build == 'true'
        run: exit 0

      # ==================== 64位构建 (aarch64) ====================
      - name: 构建 libvpx v1.14.0 (64-bit)
        if: steps.check_build.outputs.skip_build == 'false'
        run: |
          echo "📦 构建 libvpx v1.14.0 (64-bit)..."
          git clone https://chromium.googlesource.com/webm/libvpx
          cd libvpx
          git checkout v1.14.0
          ./configure \
            --prefix=${{ env.INSTALL_ROOT }} \
            --libdir=${{ env.INSTALL_ROOT }}/lib \
            --enable-shared \
            --enable-vp8 \
            --enable-vp9 \
            --enable-runtime-cpu-detect \
            --target=arm64-linux-gcc \
            --as=nasm \
            --disable-examples \
            --disable-docs
          make -j$(nproc)
          sudo mkdir -p ${{ env.INSTALL_ROOT }}/lib/gstreamer-1.0
          sudo make install
          echo "✅ libvpx v1.14.0 构建完成 (64-bit)"

      - name: 构建 libde265 (HEVC) (64-bit)
        if: steps.check_build.outputs.skip_build == 'false'
        run: |
          echo "📦 构建 libde265 HEVC (64-bit)..."
          git clone --depth=1 https://github.com/strukturag/libde265.git
          cd libde265
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_ROOT }} \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DENABLE_SDL=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTING=OFF
          make -j$(nproc)
          sudo make install
          echo "✅ libde265 编译安装完成 (64-bit)"

      - name: 构建 libaom (AV1) (64-bit)
        if: steps.check_build.outputs.skip_build == 'false'
        run: |
          echo "📦 构建 libaom AV1 Codec (64-bit)..."
          sudo mkdir -p ${{ env.INSTALL_ROOT }}
          sudo chmod 755 ${{ env.INSTALL_ROOT }}
          git clone --depth=1 https://aomedia.googlesource.com/aom
          cd aom
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_ROOT }} \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_INSTALL_BINDIR=bin \
            -DCMAKE_INSTALL_INCLUDEDIR=include \
            -DENABLE_AV1=ON \
            -DENABLE_TESTS=OFF \
            -DENABLE_EXAMPLES=OFF \
            -DCONFIG_RUNTIME_CPU_DETECT=ON \
            -DAOM_TARGET_CPU=arm64
          make -j$(nproc)
          sudo make install
          sudo chmod -R 755 ${{ env.INSTALL_ROOT }}/lib
          sudo chmod -R 755 ${{ env.INSTALL_ROOT }}/include
          echo "✅ libaom 编译安装完成 (64-bit)"

      - name: 构建 GStreamer (64-bit)
        if: steps.check_build.outputs.skip_build == 'false'
        run: |
          cd gstreamer
          git submodule update --init --recursive
          sudo mkdir -p $INSTALL_ROOT
          sudo chmod -R 777 /data
          export PKG_CONFIG_PATH=${{ env.INSTALL_ROOT }}/lib/pkgconfig:$PKG_CONFIG_PATH
          meson setup build64 \
            --prefix=$INSTALL_ROOT \
            --libdir=lib \
            --libexecdir=$INSTALL_ROOT/lib/gstreamer1.0 \
            -Dbase=enabled \
            -Dpackage-origin="Termux-Glibc-64bit" \
            -Dgood=enabled \
            -Dugly=enabled \
            -Dbad=enabled \
            -Dlibav=enabled \
            -Dgpl=enabled \
            -Ddefault_library=shared \
            -Dtests=disabled \
            -Ddoc=disabled \
            -Dexamples=disabled \
            -Dpython=disabled \
            -Dnls=disabled \
            -Dgst-plugins-good:pulse=enabled \
            -Dgst-plugins-good:oss4=disabled \
            -Dgst-plugins-good:oss=disabled \
            -Dgst-plugins-good:vpx=enabled \
            -Dgst-plugins-bad:drm=disabled \
            -Dgst-plugins-bad:hip=disabled \
            -Dgst-plugins-bad:nvcodec=disabled \
            -Dgst-plugins-bad:aom=enabled \
            -Dgst-plugins-bad:libde265=enabled \
            -Dgst-plugins-bad:dtls=disabled \
            -Dgst-plugins-bad:x11=enabled \
            -Dgst-plugins-bad:gl=disabled \
            -Dgst-plugins-base:drm=disabled \
            -Dgst-plugins-base:gl=disabled \
            -Dgst-plugins-base:alsa=disabled \
            -Dgst-plugins-base:theora=enabled \
            -Dgst-plugins-base:x11=enabled \
            -Dintrospection=disabled \
            -Dgst-full=enabled \
            -Dgst-full-plugins='*' \
            -Ddevtools=enabled \
            -Drtsp_server=disabled \
            --buildtype=release
          ninja -C build64 -j$(nproc)
          ninja -C build64 install
          echo "✅ GStreamer 编译完成 (64-bit)"

      - name: 修补 ELF (64-bit)
        if: steps.check_build.outputs.skip_build == 'false'
        run: |
          INTERP=$INSTALL_ROOT/lib/ld-linux-aarch64.so.1
          echo "🔧 修补 ELF 解释器 (64-bit): $INTERP"
          for DIR in bin lib/gstreamer1.0/gstreamer-1.0; do
            if [ -d "$INSTALL_ROOT/$DIR" ]; then
              find "$INSTALL_ROOT/$DIR" -type f -exec file {} \; | grep ELF | cut -d: -f1 | while read f; do
                patchelf --set-interpreter "$INTERP" "$f" 2>/dev/null || true
              done
            fi
          done

      # ==================== 32位构建 (armv7l) ====================
      - name: 创建 Meson 交叉编译文件 (32-bit)
        if: steps.check_build.outputs.skip_build == 'false'
        run: |
          cat > meson.cross << EOF
          [binaries]
          c = 'arm-linux-gnueabihf-gcc'
          cpp = 'arm-linux-gnueabihf-g++'
          ar = 'arm-linux-gnueabihf-ar'
          strip = 'arm-linux-gnueabihf-strip'
          pkgconfig = 'arm-linux-gnueabihf-pkg-config'
          
          [host_machine]
          system = 'linux'
          cpu_family = 'arm'
          cpu = 'armv7l'
          endian = 'little'
          
          [properties]
          c_args = ['-march=armv7-a', '-mthumb', '-mfpu=neon', '-mfloat-abi=softfp']
          c_link_args = ['-march=armv7-a', '-mthumb', '-mfpu=neon', '-mfloat-abi=softfp']
          cpp_args = ['-march=armv7-a', '-mthumb', '-mfpu=neon', '-mfloat-abi=softfp']
          cpp_link_args = ['-march=armv7-a', '-mthumb', '-mfpu=neon', '-mfloat-abi=softfp']
          EOF

      - name: 构建 libvpx v1.14.0 (32-bit)
        if: steps.check_build.outputs.skip_build == 'false'
        run: |
          echo "📦 构建 libvpx v1.14.0 (32-bit)..."
          cd libvpx
          make distclean || true
          export CC=arm-linux-gnueabihf-gcc
          export CXX=arm-linux-gnueabihf-g++
          export AR=arm-linux-gnueabihf-ar
          export LD=arm-linux-gnueabihf-ld
          ./configure \
            --prefix=${{ env.INSTALL_ROOT }} \
            --libdir=${{ env.INSTALL_ROOT }}/lib32 \
            --enable-shared \
            --enable-vp8 \
            --enable-vp9 \
            --enable-runtime-cpu-detect \
            --target=armv7-linux-gcc \
            --as=nasm \
            --disable-examples \
            --disable-docs \
            --extra-cflags="-march=armv7-a -mthumb -mfpu=neon -mfloat-abi=softfp" \
            --extra-cxxflags="-march=armv7-a -mthumb -mfpu=neon -mfloat-abi=softfp"
          make -j$(nproc)
          sudo mkdir -p ${{ env.INSTALL_ROOT }}/lib32/gstreamer-1.0
          sudo make install
          echo "✅ libvpx v1.14.0 构建完成 (32-bit)"

      - name: 构建 libde265 (HEVC) (32-bit)
        if: steps.check_build.outputs.skip_build == 'false'
        run: |
          echo "📦 构建 libde265 HEVC (32-bit)..."
          cd libde265
          rm -rf build
          mkdir -p build && cd build
          export CC=arm-linux-gnueabihf-gcc
          export CXX=arm-linux-gnueabihf-g++
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_ROOT }} \
            -DCMAKE_INSTALL_LIBDIR=lib32 \
            -DENABLE_SDL=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTING=OFF \
            -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
            -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ \
            -DCMAKE_C_FLAGS="-march=armv7-a -mthumb -mfpu=neon -mfloat-abi=softfp" \
            -DCMAKE_CXX_FLAGS="-march=armv7-a -mthumb -mfpu=neon -mfloat-abi=softfp"
          make -j$(nproc)
          sudo make install
          echo "✅ libde265 编译安装完成 (32-bit)"

      - name: 构建 libaom (AV1) (32-bit)
        if: steps.check_build.outputs.skip_build == 'false'
        run: |
          echo "📦 构建 libaom AV1 Codec (32-bit)..."
          sudo mkdir -p ${{ env.INSTALL_ROOT }}
          sudo chmod 755 ${{ env.INSTALL_ROOT }}
          cd aom
          rm -rf build
          mkdir -p build && cd build
          export CC=arm-linux-gnueabihf-gcc
          export CXX=arm-linux-gnueabihf-g++
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_ROOT }} \
            -DCMAKE_INSTALL_LIBDIR=lib32 \
            -DCMAKE_INSTALL_BINDIR=bin \
            -DCMAKE_INSTALL_INCLUDEDIR=include \
            -DENABLE_AV1=ON \
            -DENABLE_TESTS=OFF \
            -DENABLE_EXAMPLES=OFF \
            -DCONFIG_RUNTIME_CPU_DETECT=ON \
            -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
            -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ \
            -DCMAKE_C_FLAGS="-march=armv7-a -mthumb -mfpu=neon -mfloat-abi=softfp" \
            -DCMAKE_CXX_FLAGS="-march=armv7-a -mthumb -mfpu=neon -mfloat-abi=softfp"
          make -j$(nproc)
          sudo make install
          sudo chmod -R 755 ${{ env.INSTALL_ROOT }}/lib32
          sudo chmod -R 755 ${{ env.INSTALL_ROOT }}/include
          echo "✅ libaom 编译安装完成 (32-bit)"

      - name: 构建 GStreamer (32-bit)
        if: steps.check_build.outputs.skip_build == 'false'
        run: |
          cd gstreamer
          sudo mkdir -p $INSTALL_ROOT
          sudo chmod -R 777 /data
          export PKG_CONFIG_PATH=${{ env.INSTALL_ROOT }}/lib32/pkgconfig:$PKG_CONFIG_PATH
          export CC=arm-linux-gnueabihf-gcc
          export CXX=arm-linux-gnueabihf-g++
          export AR=arm-linux-gnueabihf-ar
          export STRIP=arm-linux-gnueabihf-strip
          
          meson setup build32 \
            --prefix=$INSTALL_ROOT \
            --libdir=lib32 \
            --libexecdir=$INSTALL_ROOT/lib32/gstreamer1.0 \
            --cross-file ../meson.cross \
            -Dbase=enabled \
            -Dpackage-origin="Termux-Glibc-32bit" \
            -Dgood=enabled \
            -Dugly=enabled \
            -Dbad=enabled \
            -Dlibav=enabled \
            -Dgpl=enabled \
            -Ddefault_library=shared \
            -Dtests=disabled \
            -Ddoc=disabled \
            -Dexamples=disabled \
            -Dpython=disabled \
            -Dnls=disabled \
            -Dgst-plugins-good:pulse=enabled \
            -Dgst-plugins-good:oss4=disabled \
            -Dgst-plugins-good:oss=disabled \
            -Dgst-plugins-good:vpx=enabled \
            -Dgst-plugins-bad:drm=disabled \
            -Dgst-plugins-bad:hip=disabled \
            -Dgst-plugins-bad:nvcodec=disabled \
            -Dgst-plugins-bad:aom=enabled \
            -Dgst-plugins-bad:libde265=enabled \
            -Dgst-plugins-bad:dtls=disabled \
            -Dgst-plugins-bad:x11=enabled \
            -Dgst-plugins-bad:gl=disabled \
            -Dgst-plugins-base:drm=disabled \
            -Dgst-plugins-base:gl=disabled \
            -Dgst-plugins-base:alsa=disabled \
            -Dgst-plugins-base:theora=enabled \
            -Dgst-plugins-base:x11=enabled \
            -Dintrospection=disabled \
            -Dgst-full=enabled \
            -Dgst-full-plugins='*' \
            -Ddevtools=enabled \
            -Drtsp_server=disabled \
            --buildtype=release
          ninja -C build32 -j$(nproc)
          ninja -C build32 install
          echo "✅ GStreamer 编译完成 (32-bit)"

      - name: 修补 ELF (32-bit)
        if: steps.check_build.outputs.skip_build == 'false'
        run: |
          INTERP=$INSTALL_ROOT/lib/ld-linux-armhf.so.3
          echo "🔧 修补 ELF 解释器 (32-bit): $INTERP"
          for DIR in bin lib32/gstreamer1.0/gstreamer-1.0; do
            if [ -d "$INSTALL_ROOT/$DIR" ]; then
              find "$INSTALL_ROOT/$DIR" -type f -exec file {} \; | grep ELF | cut -d: -f1 | while read f; do
                patchelf --set-interpreter "$INTERP" "$f" 2>/dev/null || true
              done
            fi
          done

      # ==================== 打包和发布 ====================
      - name: 打包 64-bit
        if: steps.check_build.outputs.skip_build == 'false'
        run: |
          cd /data/data/com.termux/files/usr
          TAR_NAME_64="termux-glibc-gst-decoders-64bit-${VERSION}.tar.gz"
          tar -czvf /home/runner/$TAR_NAME_64 glibc
          echo "TAR_NAME_64=$TAR_NAME_64" >> $GITHUB_ENV

      - name: 打包 32-bit
        if: steps.check_build.outputs.skip_build == 'false'
        run: |
          cd /data/data/com.termux/files/usr
          TAR_NAME_32="termux-glibc-gst-decoders-32bit-${VERSION}.tar.gz"
          tar -czvf /home/runner/$TAR_NAME_32 glibc
          echo "TAR_NAME_32=$TAR_NAME_32" >> $GITHUB_ENV

      - name: 保存提交记录
        if: steps.check_build.outputs.skip_build == 'false'
        run: |
          echo "$LATEST_COMMIT" > ${{ env.LAST_COMMIT_FILE }}

      - name: 上传 64-bit 产物
        if: steps.check_build.outputs.skip_build == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAR_NAME_64 }}
          path: /home/runner/${{ env.TAR_NAME_64 }}

      - name: 上传 32-bit 产物
        if: steps.check_build.outputs.skip_build == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAR_NAME_32 }}
          path: /home/runner/${{ env.TAR_NAME_32 }}

      - name: 上传提交记录
        if: steps.check_build.outputs.skip_build == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: last-gst-commit
          path: ${{ env.LAST_COMMIT_FILE }}
          retention-days: 365

      - name: 发布到 GitHub Release (64-bit)
        if: steps.check_build.outputs.skip_build == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION }}-64bit
          name: "GStreamer Decoders ${{ env.VERSION }} (aarch64, Termux glibc + AOM AV1 + de265 HEVC + DTLS)"
          body: |
            ## 🎯 GStreamer 开发版本构建 (64-bit aarch64)
            
            ### 📋 构建信息
            - **版本**: `${{ env.VERSION }}`
            - **架构**: aarch64 (64-bit)
            - **环境**: Termux glibc
            - **提交**: [`${{ env.COMMIT_SHORT }}`](https://gitlab.freedesktop.org/gstreamer/gstreamer/-/commit/${{ env.LATEST_COMMIT }})
            - **提交日期**: ${{ env.COMMIT_DATE }}
            - **作者**: `${{ env.AUTHOR }}`
            - **构建时间**: `${{ env.BUILD_DATE }}`
            
            ### 🛠️ 构建特性
            - ✅ AOM AV1 解码器
            - ✅ libde265 HEVC 解码器
            - ✅ libvpx VP8/VP9
            - ✅ 完整 GStreamer 插件集
            - 🏗️ **构建类型**: release
            
            ### 📦 文件信息
            - **文件名**: `${{ env.TAR_NAME_64 }}`
          files: /home/runner/${{ env.TAR_NAME_64 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 发布到 GitHub Release (32-bit)
        if: steps.check_build.outputs.skip_build == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION }}-32bit
          name: "GStreamer Decoders ${{ env.VERSION }} (armv7l 32-bit, Termux glibc + AOM AV1 + de265 HEVC + DTLS)"
          body: |
            ## 🎯 GStreamer 开发版本构建 (32-bit armv7l)
            
            ### 📋 构建信息
            - **版本**: `${{ env.VERSION }}`
            - **架构**: armv7l (32-bit)
            - **环境**: Termux glibc
            - **提交**: [`${{ env.COMMIT_SHORT }}`](https://gitlab.freedesktop.org/gstreamer/gstreamer/-/commit/${{ env.LATEST_COMMIT }})
            - **提交日期**: ${{ env.COMMIT_DATE }}
            - **作者**: `${{ env.AUTHOR }}`
            - **构建时间**: `${{ env.BUILD_DATE }}`
            
            ### 🛠️ 构建特性
            - ✅ AOM AV1 解码器
            - ✅ libde265 HEVC 解码器
            - ✅ libvpx VP8/VP9
            - ✅ 完整 GStreamer 插件集
            - 🏗️ **构建类型**: release
            
            ### 📦 文件信息
            - **文件名**: `${{ env.TAR_NAME_32 }}`
          files: /home/runner/${{ env.TAR_NAME_32 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
